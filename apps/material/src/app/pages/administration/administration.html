<div *transloco="let t" class="admin-container">
  <div class="admin-header">
    <div class="header-titles">
      <h1 class="mat-headline-medium title">{{ t('administration.title') }}</h1>
      <p class="mat-body-medium subtitle">{{ t('administration.subtitle') }}</p>
    </div>

    <div class="header-actions">
      <a
        mat-button
        appRedFocus
        routerLink="/"
      >
        {{ t('common.back') }}
      </a>
      <button
        mat-flat-button
        color="primary"
        appRedFocus
        type="button"
        (click)="openCreateModal()"
      >
        <svg lucidePlus size="20"></svg>
        <span>{{ t('administration.add_product') }}</span>
      </button>
    </div>
  </div>

  <mat-card appearance="outlined" class="table-card">
    <mat-card-content class="table-card-content">
      <app-order-table></app-order-table>
    </mat-card-content>
  </mat-card>
</div>

<div class="h-screen w-full flex flex-col overflow-hidden">

  <!-- Global HTTP progress bar: self-contained, always mounted (hidden via CSS) -->
  <app-progress />

  <app-navbar class="z-50 shrink-0 w-full max-w-full"></app-navbar>

  <div id="main-scroll-area"
       class="relative flex-1 overflow-y-auto overflow-x-hidden overscroll-y-contain flex flex-col min-w-0">

    @if (showBanner()) {
      <app-banner></app-banner>
    }

    <div class="flex flex-col md:flex-row flex-grow relative">
      @if (store.isMobile()) {
        <aside
          class="absolute inset-0 z-30 bg-base-100/95 backdrop-blur-md flex flex-col gap-4 h-[calc(100vh-64px)] overflow-y-auto transition-all duration-500 ease-in-out
             {{ showFilter()
                ? 'p-6 opacity-100 translate-y-0 pointer-events-auto'
                : 'p-0 opacity-0 -translate-y-4 pointer-events-none overflow-hidden' }}"
        >
          <app-filter [isCollapsed]="!showFilter()"></app-filter>
        </aside>
      } @else {
        <aside
          class="border-base-300 bg-base-100/60 backdrop-blur-md sticky top-0 shrink-0 z-30 transition-all duration-500 ease-in-out flex flex-col h-[calc(100vh-64px)]
             {{ showFilter() ? 'w-72 p-6 border-r opacity-100' : 'w-0 p-0 border-r-0 opacity-0 pointer-events-none overflow-hidden' }}"
        >
          <app-filter [isCollapsed]="!showFilter()"></app-filter>
        </aside>
      }

      <main class="flex-grow p-4 md:p-6 min-w-0">
        <router-outlet></router-outlet>
        <app-toast />
      </main>

    </div>

    <app-footer></app-footer>
  </div>

  <app-scroll-btn />
</div>

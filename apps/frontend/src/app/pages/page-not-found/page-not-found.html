<main class="flex flex-col items-center justify-start py-6" *transloco="let t">

  <div
    class="hero min-h-screen"
    style="background-image: url('/images/hong-kong-4k.jpg');"
  >
    <div class="hero-overlay"></div>
    <div class="hero-content text-neutral-content text-center">
      <div class="max-w-md">
        <h1 class="mb-5 text-5xl font-bold dark:text-black">
          {{ t('administration.not_found') }}
        </h1>
        <p class="mb-5 text-lg dark:text-black">
          {{ t('administration.sorry') }}
        </p>
        <div class="mt-8 flex items-center justify-center gap-x-6">
          <button appRedFocus routerLink="/" class="btn btn-xl btn-primary shadow-sm">
            {{ t('administration.back_home') }}
          </button>

          <button
            appRedFocus
            (click)="$event.preventDefault()"
            class="btn btn-xl btn-primary tooltip"
            data-tip="Work in progress"
          >
            {{ t('administration.support') }} <span aria-hidden="true">&rarr;</span>
          </button>
        </div>
      </div>
    </div>
  </div>

</main>

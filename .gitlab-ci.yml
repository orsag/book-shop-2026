.node_env_template: &node_env_template
  image:
    name: cypress/browsers:24.16.0
    entrypoint: [""]

  # Set database credentials and connection variables
  variables:
    npm_config_cache: "/tmp/npm-cache"
    NODE_ENV: "production"
    NPM_CONFIG_PRODUCTION: false
    NODE_OPTIONS: "--max-old-space-size=8192"
    CYPRESS_CACHE_FOLDER: "/root/.cache/Cypress"
    # Set default values if UI variables are empty/missing
    POSTGRES_DB: "mydatabase"
    POSTGRES_USER: "myusername"
    POSTGRES_PASSWORD: "mypassword"

    # Constructed connection string
    DATABASE_URL: "postgresql://myusername:mypassword@postgres-db:5432/mydatabase?schema=public&connection_limit=20"
    # NestJS Backend Environment Variables
    JWT_SECRET: "default_secret_key"
    JWT_EXPIRES_IN: "1d"
    USERNAME: "bossmann"
    PASSWORD: "admin12345"
    TEST_NAME: "testinguser"
    TEST_PASSWORD: "tester12345"
    UPLOAD_LOCATION: "./uploads"

  # Spin up the database container alongside the Cypress container
  services:
    - name: postgres:18.3-alpine
      alias: postgres-db # Alias to reach the DB via hostname

  before_script:
    - npm install --no-audit --no-fund


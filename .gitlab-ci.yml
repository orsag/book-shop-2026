cypress-e2e-backend:
  stage: e2e-backend
  <<: *node_env_template
  script:
    - echo "Starting NestJS Backend API (E2E) Tests"
    - npx prisma generate
    - npx prisma db push
    - npm run seed

    - npx nx run libs:build
    - npx nx build backend --skip-nx-cache
    - npx nx run backend:e2e

